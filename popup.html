<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LitRPG Release Watch</title>
  <link rel="stylesheet" href="popup.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Crimson+Text:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <h1 class="logo">LitRPG Release Watch</h1>
      <div class="header-actions">
        <button id="checkNowBtn" class="btn-icon" title="Check Now">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
            <path d="M9 12l2 2 4-4"/>
          </svg>
        </button>
        <button id="settingsBtn" class="btn-icon" title="Settings">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"/>
            <path d="M12 1v6m0 6v6m8.66-10l-5.2 3m-6.92 4l-5.2 3M3.34 7l5.2 3m6.92 4l5.2 3"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Loading State -->
    <div id="loadingState" class="loading-state" style="display: none;">
      <div class="spinner"></div>
      <p>Checking series...</p>
    </div>

    <!-- Updates Section -->
    <section id="updatesSection" class="section">
      <div class="section-header">
        <h2 class="section-title">Updates</h2>
        <button id="markAllReadBtn" class="btn-text">Mark all read</button>
      </div>
      <div id="updatesList" class="updates-list">
        <!-- Updates will be inserted here -->
      </div>
      <div id="noUpdates" class="empty-state" style="display: none;">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M9 11l3 3L22 4"/>
          <path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/>
        </svg>
        <p>No updates</p>
        <p class="text-muted">We'll notify you when books are released</p>
      </div>
    </section>

    <!-- Series Status Section -->
    <section id="seriesSection" class="section">
      <div class="section-header">
        <h2 class="section-title">Series Status</h2>
        <a href="options.html" class="btn-text" target="_blank">Manage</a>
      </div>
      <div id="seriesList" class="series-list">
        <!-- Series will be inserted here -->
      </div>
      <div id="noSeries" class="empty-state" style="display: none;">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M4 19.5A2.5 2.5 0 016.5 17H20"/>
          <path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/>
        </svg>
        <p>No series tracked</p>
        <a href="options.html" target="_blank" class="btn-primary">Add Series</a>
      </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
      <button id="clearUpdatesBtn" class="btn-text-small">Clear all updates</button>
    </footer>
  </div>

  <script src="popup.js" type="module"></script>
</body>
</html>
